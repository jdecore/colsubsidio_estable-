<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Colsubsidio Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --amarillo: #FFD30F;
      --azul: #001F5B;
      --grafito: #202124;
      --blanco: #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--grafito);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Desktop: phone frame */
    @media (hover: hover) and (pointer: fine) and (min-width: 1024px) {
      .app-frame {
        width: 390px;
        height: min(844px, 92dvh);
        border-radius: 40px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 0 8px var(--azul);
        margin: auto;
        position: relative;
      }
    }

    /* Mobile: full screen */
    @media (hover: none) and (pointer: coarse) {
      .app-frame {
        width: 100vw;
        height: 100dvh;
        height: -webkit-fill-available;
        border-radius: 0;
      }
    }

    /* Fallback: full screen */
    .app-frame {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
      position: relative;
      overflow: hidden;
      background: var(--grafito);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas { display: none; }

    /* Capture button */
    .capture-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--azul);
      border: 4px solid var(--amarillo);
      box-shadow: 0 4px 20px rgba(0,31,91,0.5);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .capture-btn:active { transform: scale(0.9); }
    .capture-btn::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: rgba(255,211,15,0.2);
    }

    /* Mic button */
    .mic-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--amarillo);
      border: 3px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 16px rgba(255,211,15,0.4);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-btn:active { transform: scale(0.9); }
    .mic-btn.recording {
      animation: pulse-mic 1s ease-in-out infinite;
      background: #ef4444;
    }

    @keyframes pulse-mic {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
      50% { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
    }

    /* Waves animation for speaking */
    .speaking-waves {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
    }
    .speaking-waves .bar {
      width: 3px;
      background: var(--amarillo);
      border-radius: 2px;
      animation: wave 0.6s ease-in-out infinite;
    }
    .speaking-waves .bar:nth-child(2) { animation-delay: 0.1s; }
    .speaking-waves .bar:nth-child(3) { animation-delay: 0.2s; }
    .speaking-waves .bar:nth-child(4) { animation-delay: 0.3s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }

    /* Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--amarillo);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result card */
    .result-card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Action buttons */
    .action-btn {
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .action-btn:active { transform: scale(0.95); }

    .btn-confirm {
      background: var(--amarillo);
      color: var(--grafito);
      flex: 1;
    }
    .btn-retry {
      background: rgba(255,255,255,0.1);
      color: white;
      flex: 1;
    }
    .btn-voice {
      background: var(--azul);
      color: white;
      flex: 1;
    }

    /* Preview overlay */
    .preview-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: var(--grafito);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(32,33,36,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    /* Result overlay */
    .result-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      overflow-y: auto;
      background: rgba(32, 33, 36, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .app-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      background: linear-gradient(to bottom, rgba(32,33,36,0.9), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Status indicator */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.active { background: var(--amarillo); }
    .status-dot.inactive { background: #ef4444; }

    /* Checklist */
    .checklist-item {
      background: rgba(255,211,15,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }
    .checklist-item:active { background: rgba(255,211,15,0.15); }
    .checklist-item.unchecked { opacity: 0.4; }
    .checklist-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.3);
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      background: transparent;
    }
    .checklist-item input[type="checkbox"]:checked {
      background: var(--amarillo);
      border-color: var(--amarillo);
    }
    .checklist-item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 6px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .checklist-item input[type="number"] {
      width: 48px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 0;
      -moz-appearance: textfield;
    }
    .checklist-item input[type="number"]::-webkit-inner-spin-button,
    .checklist-item input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }
    .checklist-item input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      min-width: 0;
    }
    .checklist-item input[type="text"]::placeholder {
      color: rgba(255,255,255,0.3);
    }
    .add-item-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 2px dashed rgba(255,255,255,0.2);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .add-item-btn:active {
      border-color: rgba(255,255,255,0.4);
      color: white;
    }

    /* Confirm success */
    #confirmSuccess {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
      min-height: 100%;
    }

    /* Bottom controls */
    .bottom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 20px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    /* ===== MOBILE OPTIMIZATIONS ===== */
    @media (max-width: 480px) {
      /* Bigger action buttons with more spacing */
      .action-btn {
        padding: 14px 12px;
        border-radius: 12px;
        font-size: 13px;
        min-height: 48px;
      }
      .flex.gap-2.mt-3 {
        gap: 8px;
      }

      /* Better checklist items touch targets */
      .checklist-item {
        padding: 12px 10px;
        gap: 8px;
        min-height: 48px;
      }
      .checklist-item input[type="checkbox"] {
        width: 24px;
        height: 24px;
      }
      .checklist-item input[type="number"] {
        width: 52px;
        font-size: 16px;
        padding: 6px 0;
      }
      .checklist-item input[type="text"] {
        font-size: 15px;
      }

      /* Bigger add item button */
      .add-item-btn {
        padding: 14px;
        font-size: 14px;
        min-height: 48px;
      }

      /* Bottom controls spacing */
      .bottom-controls {
        gap: 20px;
        padding: 16px;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
      .mic-btn {
        width: 60px;
        height: 60px;
      }
      .capture-btn {
        width: 76px;
        height: 76px;
      }

      /* Result overlay padding */
      .result-overlay {
        padding: 12px;
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }

      /* Confirm success bigger buttons */
      #confirmSuccess .action-btn {
        padding: 16px;
        font-size: 15px;
        min-height: 52px;
      }

      /* Result card header */
      .result-card h3 {
        font-size: 16px;
      }
    }

    /* Safe area for devices with notch */
    @supports (padding: env(safe-area-inset-top)) {
      .app-header {
        padding-top: env(safe-area-inset-top);
      }
      .bottom-controls {
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="app-frame" id="app">
    <!-- Video feed -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- Header -->
    <div class="app-header">
      <div class="flex items-center gap-2">
        <span class="text-white font-bold text-lg tracking-tight">Colsubsidio</span>
        <span class="text-yellow-400 font-semibold text-lg">Vision</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="speaking-waves" id="speakingWaves" style="display:none">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span class="status-dot active" id="statusDot"></span>
        <span class="text-white/70 text-xs" id="statusText">Activa</span>
      </div>
    </div>

    <!-- Preview overlay -->
    <div class="preview-overlay" id="previewOverlay" style="display:none">
      <img id="previewImg" src="" alt="Preview" />
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display:none">
      <div class="spinner"></div>
      <p class="text-white font-medium" id="loadingText">Analizando imagen...</p>
      <div class="speaking-waves">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>

    <!-- Result overlay -->
    <div class="result-overlay" id="resultOverlay" style="display:none">
      <div class="result-card">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-white font-bold text-base">Inventario</h3>
          <span class="text-xs px-2 py-1 rounded-full bg-yellow-500/20 text-yellow-300" id="providerBadge">IA</span>
        </div>

        <p class="text-white/60 text-xs mb-3" id="resultDescription"></p>

        <div id="objectsList" class="space-y-2 mb-3" style="flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;"></div>

        <button class="add-item-btn" onclick="addItem()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Agregar producto
        </button>

        <div class="flex gap-2 mt-3">
          <button class="action-btn btn-confirm" onclick="confirmAction()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
            Confirmar
          </button>
          <button class="action-btn btn-retry" onclick="retryAction()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L4 4m16 16l-1.64-1.64A9 9 0 0 1 3.51 15"/></svg>
            Reintentar
          </button>
          <button class="action-btn btn-voice" onclick="startVoiceConfirmation()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
            Hablar
          </button>
        </div>
      </div>

      <!-- Confirm success (hidden by default) -->
      <div id="confirmSuccess" style="display:none">
        <div class="w-16 h-16 rounded-full bg-yellow-500/20 flex items-center justify-center mb-4">
          <svg width="32" height="32" fill="none" stroke="#FFD30F" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h3 class="text-white font-bold text-lg mb-2">Inventario Confirmado</h3>
        <p class="text-white/60 text-sm mb-6" id="confirmSummary"></p>
        <button class="action-btn btn-confirm" onclick="generateReport()" style="width:100%">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Descargar informe
        </button>
        <button class="action-btn btn-retry" onclick="resetApp()" style="width:100%; margin-top:8px;">
          Nuevo inventario
        </button>
      </div>
    </div>

    <!-- Recording indicator -->
    <div id="recordingIndicator" style="display:none"
         class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50
                bg-red-500/90 text-white px-6 py-3 rounded-full font-bold text-sm
                flex items-center gap-2">
      <div class="w-3 h-3 bg-white rounded-full animate-pulse"></div>
      Grabando... suelta para enviar
    </div>

    <!-- Bottom controls -->
    <div class="bottom-controls">
      <div class="flex flex-col items-center gap-1">
        <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
          <svg width="24" height="24" fill="var(--grafito)" viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="var(--grafito)" stroke-width="2"/>
            <line x1="12" y1="19" x2="12" y2="23" stroke="var(--grafito)" stroke-width="2"/>
            <line x1="8" y1="23" x2="16" y2="23" stroke="var(--grafito)" stroke-width="2"/>
          </svg>
        </button>
        <span class="text-white/50 text-xs">Hablar</span>
      </div>

      <button class="capture-btn" id="captureBtn" onclick="captureImage()"></button>

      <button class="action-btn btn-retry" style="padding:10px 16px; font-size:12px;" onclick="autoAnalyze()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Auto
      </button>
    </div>
  </div>

  <!-- Hidden audio element -->
  <audio id="audioPlayer" style="display:none"></audio>

  <script>
    const API = 'https://colsubsidio-estable.onrender.com';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const previewOverlay = document.getElementById('previewOverlay');
    const previewImg = document.getElementById('previewImg');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const resultOverlay = document.getElementById('resultOverlay');
    const resultDescription = document.getElementById('resultDescription');
    const providerBadge = document.getElementById('providerBadge');
    const objectsList = document.getElementById('objectsList');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const speakingWaves = document.getElementById('speakingWaves');
    const micBtn = document.getElementById('micBtn');
    const recordingIndicator = document.getElementById('recordingIndicator');
    const audioPlayer = document.getElementById('audioPlayer');

    let stream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentResult = null;
    let isSpeaking = false;
    let autoMode = false;
    let autoInterval = null;

    // --- Camera ---
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        setStatus(true, 'Activa');
      } catch (err) {
        console.error('Camera error:', err);
        setStatus(false, 'Sin camara');
        speak('No se pudo acceder a la camara. Permite los permisos.');
      }
    }

    function setStatus(active, text) {
      statusDot.className = 'status-dot ' + (active ? 'active' : 'inactive');
      statusText.textContent = text;
    }

    // --- Capture ---
    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      previewImg.src = dataUrl;
      previewOverlay.style.display = 'flex';
      analyzeImage(dataUrl.split(',')[1]);
    }

    // --- Auto analyze ---
    function autoAnalyze() {
      autoMode = !autoMode;
      if (autoMode) {
        speak('Modo automatico activado. Analizare cada 5 segundos.');
        autoInterval = setInterval(captureImage, 5000);
      } else {
        speak('Modo automatico desactivado.');
        clearInterval(autoInterval);
      }
    }

    // --- Analyze ---
    async function analyzeImage(base64) {
      previewOverlay.style.display = 'none';
      loadingOverlay.style.display = 'flex';
      loadingText.textContent = 'Analizando imagen...';
      speak('Analizando imagen, por favor espera.');

      try {
        const res = await fetch(`${API}/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64 }),
        });
        if (!res.ok) throw new Error('Error del servidor');
        const data = await res.json();
        currentResult = data;
        if (autoMode && data.objects && data.objects.length > 0) {
          autoMode = false;
          clearInterval(autoInterval);
        }
        showResult(data);
        speakResult(data);
      } catch (err) {
        console.error(err);
        loadingOverlay.style.display = 'none';
        speak('Hubo un error al analizar la imagen. Intenta de nuevo.');
      }
    }

    function showResult(data) {
      loadingOverlay.style.display = 'none';
      resultOverlay.style.display = 'block';

      const provider = data._provider || 'ia';
      providerBadge.textContent = provider.toUpperCase();

      resultDescription.textContent = data.description || 'Sin descripcion disponible.';

      objectsList.innerHTML = '';
      if (data.objects && data.objects.length > 0) {
        data.objects.forEach((obj, i) => {
          addChecklistItem(obj.name, obj.quantity || 1, obj.confidence, i);
        });
      }
    }

    function addChecklistItem(name, quantity, confidence, index) {
      const div = document.createElement('div');
      div.className = 'checklist-item';
      div.dataset.index = index;
      div.innerHTML = `
        <input type="checkbox" checked onchange="toggleItem(this)" />
        <input type="text" value="${name}" placeholder="Producto" />
        <input type="number" value="${quantity}" min="1" max="999" />
        ${confidence != null ? `
        <span class="text-xs px-2 py-1 rounded-full ${confidence > 0.8 ? 'bg-green-500/20 text-green-300' : 'bg-yellow-500/20 text-yellow-300'}">
          ${Math.round(confidence * 100)}%
        </span>` : ''}
      `;
      objectsList.appendChild(div);
    }

    function addItem() {
      const count = objectsList.children.length;
      addChecklistItem('', 1, null, count);
      const lastInput = objectsList.lastElementChild.querySelector('input[type="text"]');
      if (lastInput) lastInput.focus();
    }

    function toggleItem(checkbox) {
      const item = checkbox.closest('.checklist-item');
      item.classList.toggle('unchecked', !checkbox.checked);
    }

    function getCheckedItems() {
      const items = [];
      objectsList.querySelectorAll('.checklist-item').forEach(item => {
        const checked = item.querySelector('input[type="checkbox"]').checked;
        if (!checked) return;
        const name = item.querySelector('input[type="text"]').value.trim();
        const quantity = parseInt(item.querySelector('input[type="number"]').value) || 1;
        if (name) items.push({ name, quantity });
      });
      return items;
    }

    function speakResult(data) {
      const numNames = {
        1:'uno', 2:'dos', 3:'tres', 4:'cuatro', 5:'cinco',
        6:'seis', 7:'siete', 8:'ocho', 9:'nueve', 10:'diez',
        11:'once', 12:'doce'
      };
      let text = '';
      if (data.description) {
        text += data.description + '. ';
      }
      if (data.objects && data.objects.length > 0) {
        text += 'Encontré ' + data.objects.length + ' elemento' + (data.objects.length > 1 ? 's' : '') + '. ';
        data.objects.forEach(obj => {
          const qtyWord = numNames[obj.quantity] || obj.quantity;
          text += obj.name + ', cantidad ' + qtyWord + '. ';
        });
      }
      if (data.suggestion) {
        text += data.suggestion;
      }
      if (!text) text = 'No pude analizar la imagen correctamente.';
      speak(text);
    }

    // --- TTS ---
    let speakTimeout = null;

    function splitTextForTTS(text, maxLen) {
      if (text.length <= maxLen) return [text];
      const parts = [];
      let remaining = text;
      while (remaining.length > 0) {
        if (remaining.length <= maxLen) {
          parts.push(remaining);
          break;
        }
        let cut = remaining.lastIndexOf('. ', maxLen);
        if (cut <= 0) cut = remaining.lastIndexOf(' ', maxLen);
        if (cut <= 0) cut = maxLen;
        else cut += 1;
        parts.push(remaining.slice(0, cut));
        remaining = remaining.slice(cut).trim();
      }
      return parts;
    }

    function speakChunk(chunks, index) {
      if (index >= chunks.length) {
        isSpeaking = false;
        speakingWaves.style.display = 'none';
        clearTimeout(speakTimeout);
        return;
      }
      const text = chunks[index];
      fetch(`${API}/speak`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      })
        .then(res => {
          if (!res.ok) throw new Error('TTS failed');
          return res.blob();
        })
        .then(blob => {
          const url = URL.createObjectURL(blob);
          audioPlayer.src = url;
          audioPlayer.onended = () => {
            URL.revokeObjectURL(url);
            speakChunk(chunks, index + 1);
          };
          audioPlayer.play();
        })
        .catch(() => {
          retrySpeak(chunks, index, 0);
        });
    }

    function retrySpeak(chunks, index, attempt) {
      const text = chunks[index];
      if (attempt >= 2) {
        fallbackSpeak(text, () => speakChunk(chunks, index + 1));
        return;
      }
      setTimeout(() => {
        fetch(`${API}/speak`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        })
          .then(res => {
            if (!res.ok) throw new Error('retry failed');
            return res.blob();
          })
          .then(blob => {
            const url = URL.createObjectURL(blob);
            audioPlayer.src = url;
            audioPlayer.onended = () => {
              URL.revokeObjectURL(url);
              speakChunk(chunks, index + 1);
            };
            audioPlayer.play();
          })
          .catch(() => retrySpeak(chunks, index, attempt + 1));
      }, 500);
    }

    function fallbackSpeak(text, onEnd) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-CO';
        u.onend = () => { if (onEnd) onEnd(); };
        u.onerror = () => { if (onEnd) onEnd(); };
        window.speechSynthesis.speak(u);
      } else {
        if (onEnd) onEnd();
      }
    }

    function speak(text) {
      if (isSpeaking) {
        stopSpeaking();
      }
      isSpeaking = true;
      speakingWaves.style.display = 'flex';

      clearTimeout(speakTimeout);
      speakTimeout = setTimeout(() => {
        isSpeaking = false;
        speakingWaves.style.display = 'none';
      }, 30000);

      const chunks = splitTextForTTS(text, 4000);
      speakChunk(chunks, 0);
    }

    function stopSpeaking() {
      audioPlayer.pause();
      audioPlayer.src = '';
      window.speechSynthesis.cancel();
      isSpeaking = false;
      speakingWaves.style.display = 'none';
      clearTimeout(speakTimeout);
    }

    // --- STT ---
    let recordingStartTime = 0;

    function startRecording() {
      if (isRecording) return;
      stopSpeaking();
      audioChunks = [];
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(s => {
          const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : MediaRecorder.isTypeSupported('audio/mp4')
              ? 'audio/mp4'
              : '';
          mediaRecorder = mime
            ? new MediaRecorder(s, { mimeType: mime })
            : new MediaRecorder(s);
          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            s.getTracks().forEach(t => t.stop());
            const elapsed = Date.now() - recordingStartTime;
            if (elapsed < 800) {
              loadingOverlay.style.display = 'none';
              speak('Grabacion muy corta. Manten presionado al menos un segundo.');
              return;
            }
            if (audioChunks.length > 0) {
              const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
              sendAudio(blob);
            }
          };
          recordingStartTime = Date.now();
          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
          recordingIndicator.style.display = 'flex';
        })
        .catch(() => {
          speak('Necesitas dar permisos de microfono.');
        });
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      recordingIndicator.style.display = 'none';
    }

    function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function sendAudio(blob) {
      loadingOverlay.style.display = 'flex';
      loadingText.textContent = 'Escuchando...';

      const formData = new FormData();
      const ext = blob.type.includes('webm') ? 'webm' : blob.type.includes('ogg') ? 'ogg' : blob.type.includes('mp4') ? 'mp4' : 'webm';
      formData.append('file', blob, `recording.${ext}`);

      console.log('STT sendAudio:', { type: blob.type, size: blob.size, ext });

      try {
        const res = await fetch(`${API}/transcribe`, {
          method: 'POST',
          body: formData,
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          loadingOverlay.style.display = 'none';
          return transcribeWithBrowser(errData.detail || 'STT failed');
        }
        const data = await res.json();
        console.log('STT result:', data);
        if (!data.text || !data.text.trim()) {
          loadingOverlay.style.display = 'none';
          return transcribeWithBrowser();
        }
        processVoiceCommand(data.text);
      } catch (err) {
        console.error('STT error:', err);
        loadingOverlay.style.display = 'none';
        transcribeWithBrowser(err.message || 'STT error');
      }
    }

    function transcribeWithBrowser(reason) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speak('No pude entender el audio. Intenta de nuevo.');
        return;
      }
      let processed = false;
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-CO';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = (event) => {
        processed = true;
        const transcript = event.results[0][0].transcript;
        processVoiceCommand(transcript);
      };
      recognition.onerror = () => {
        if (!processed) {
          speak('No pude entender el audio. Intenta de nuevo.');
        }
      };
      recognition.onend = () => {
        if (!processed) {
          speak('No pude entender el audio. Intenta de nuevo.');
        }
      };
      recognition.start();
    }

    function processVoiceCommand(text) {
      loadingOverlay.style.display = 'none';
      const lower = text.toLowerCase().trim();
      
      // Force stop any current speech before responding
      stopSpeaking();
      
      // Si estamos en el menú de resultado → agregar items al checklist
      if (resultOverlay.style.display === 'block') {
        const items = parseInventoryText(lower);
        if (items.length > 0) {
          items.forEach(item => addChecklistItem(item.name, item.quantity, null));
          speak('Agregado: ' + items.map(i => i.quantity + ' ' + i.name).join(', '));
        } else if (lower.includes('confirmar') || lower.includes('confirmo')) {
          confirmAction();
        } else if (lower.includes('reintentar') || lower.includes('otra vez')) {
          retryAction();
        } else {
          speak('No entendí los productos. Di algo como: 3 arroz, 2 leche.');
        }
        return;
      }
      
      // Si estamos en la pantalla principal → crear checklist directamente
      const items = parseInventoryText(lower);
      if (items.length > 0) {
        showResult({
          description: 'Inventario por voz: ' + text,
          objects: items.map(i => ({...i, confidence: 1.0})),
          _provider: 'voice'
        });
        speak('Encontré ' + items.length + ' producto' + (items.length > 1 ? 's' : ''));
      } else {
        speak('No entendí. Di algo como: 3 arroz, 2 leche.');
      }
    }

    function parseInventoryText(text) {
      const items = [];
      const numWords = {
        cero:0, uno:1, dos:2, tres:3, cuatro:4, cinco:5,
        seis:6, siete:7, ocho:8, nueve:9, diez:10, once:11, doce:12
      };
      const regex = /(\d+|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)\s+(?:de\s+|del\s+|la\s+|el\s+|los\s+|las\s+)?(\w+)/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        let qty = parseInt(match[1]) || numWords[match[1]] || 1;
        let name = match[2];
        name = name.replace(/es$/, '').replace(/s$/, '');
        items.push({ name, quantity: qty });
      }
      return items;
    }

    // --- Actions ---
    let confirmedInventory = [];

    function confirmAction() {
      const items = getCheckedItems();
      if (items.length === 0) {
        speak('No hay productos marcados. Marca al menos uno o agrega productos.');
        return;
      }
      confirmedInventory = items;
      
      // Ocultar checklist, mostrar éxito
      document.querySelector('.result-card > div:first-child').style.display = 'none';
      document.getElementById('resultDescription').style.display = 'none';
      document.getElementById('objectsList').style.display = 'none';
      document.querySelector('.add-item-btn').style.display = 'none';
      document.querySelector('.flex.gap-2.mt-3').style.display = 'none';
      
      const confirmDiv = document.getElementById('confirmSuccess');
      confirmDiv.style.display = 'flex';
      
      const summary = items.map(i => `${i.quantity} ${i.name}`).join(', ');
      document.getElementById('confirmSummary').textContent = summary;
      
      speak('Inventario confirmado. Puedes descargar el PDF.');
      console.log('Inventario guardado:', confirmedInventory);
    }

    function retryAction() {
      speak('Tomando nueva foto.');
      resultOverlay.style.display = 'none';
      previewOverlay.style.display = 'none';
      setTimeout(captureImage, 500);
    }

    function startVoiceConfirmation() {
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        speakingWaves.style.display = 'none';
      }
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    // --- Report Download ---
    function generateReport() {
      const btn = document.querySelector('#confirmSuccess .btn-confirm');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<svg class="animate-spin" width="18" height="18" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" opacity="0.3"/><path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg> Generando informe...';
      btn.disabled = true;

      try {
        const now = new Date();
        const fecha = now.toLocaleDateString('es-CO');
        const hora = now.toLocaleTimeString('es-CO');
        const totalQty = confirmedInventory.reduce((sum, i) => sum + i.quantity, 0);
        const rows = confirmedInventory.map((item, i) => `
          <tr style="background:${i % 2 === 0 ? '#f5f5f5' : '#fff'}">
            <td style="padding:10px 16px;font-size:14px;border-bottom:1px solid #e5e5e5">${item.name}</td>
            <td style="padding:10px 16px;font-size:14px;border-bottom:1px solid #e5e5e5;text-align:center;font-weight:600">${item.quantity}</td>
          </tr>`).join('');

        const html = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Colsubsidio Vision - Informe de Inventario</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  .header h1 { color:#fff; font-size:22px; font-weight:700; }
  .header p { color:#FFD30F; font-size:13px; margin-top:4px; }

  .footer { padding:16px 32px; text-align:center; color:#999; font-size:11px; border-top:1px solid #eee; }
  .firma { display:flex; justify-content:space-between; padding:32px; }

</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>COLSUBSIDIO</h1>
    <p>Vision - Reporte de Inventario</p>
  </div>
  <div class="meta">Fecha: ${fecha} &nbsp;|&nbsp; Hora: ${hora}</div>
  <table>
    <thead><tr><th>Producto</th><th>Cantidad</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="total">
    <span>Total items: ${confirmedInventory.length}</span>
    <span>Unidades totales: ${totalQty}</span>
  </div>
  <div class="firma">
    <div class="firma-line">Firma del responsable</div>
    <div class="firma-line">Vo.Bo.</div>
  </div>
  <div class="footer">Generado por Colsubsidio Vision</div>
</div>
</body>
</html>`;

        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `inventario_${now.toISOString().slice(0,10)}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Informe descargado';
        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.disabled = false;
        }, 2000);
      } catch (err) {
        console.error('Report error:', err);
        btn.innerHTML = 'Error al generar. Intenta de nuevo';
        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.disabled = false;
        }, 2000);
      }
    }

    // --- Reset App ---
    function resetApp() {
      confirmedInventory = [];
      resultOverlay.style.display = 'none';
      previewOverlay.style.display = 'none';
      document.querySelector('.result-card > div:first-child').style.display = 'flex';
      document.getElementById('resultDescription').style.display = 'block';
      document.getElementById('objectsList').style.display = 'block';
      document.querySelector('.add-item-btn').style.display = 'flex';
      document.querySelector('.flex.gap-2.mt-3').style.display = 'flex';
      document.getElementById('confirmSuccess').style.display = 'none';
      objectsList.innerHTML = '';
    }

    // --- Init ---
    initCamera();
  </script>
</body>
</html>
